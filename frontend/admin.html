<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EasyEvTrip — Feedback</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', -apple-system, sans-serif;
      background: #F7F6F3;
      color: #111;
      padding: 48px 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 32px;
      color: #111;
    }

    .login {
      max-width: 360px;
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #EAEAEA;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      outline: none;
    }
    input:focus { border-color: #999; }

    button {
      padding: 10px 18px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #333; }

    .error {
      margin-top: 12px;
      color: #9F2F2D;
      font-size: 13px;
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .stat {
      background: #fff;
      border: 1px solid #EAEAEA;
      border-radius: 10px;
      padding: 16px 24px;
      min-width: 140px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 600;
      line-height: 1.1;
    }
    .stat-label {
      font-size: 11px;
      color: #787774;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Stars */
    .stars { color: #D4A017; letter-spacing: 1px; }
    .stars.empty { color: #EAEAEA; }

    /* Table */
    .table-wrap {
      background: #fff;
      border: 1px solid #EAEAEA;
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #787774;
      background: #F9F9F8;
      border-bottom: 1px solid #EAEAEA;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid #F0F0EE;
      vertical-align: top;
      line-height: 1.5;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #FAFAF9; }

    .comment { color: #444; max-width: 360px; }
    .empty-comment { color: #ADADAD; font-style: italic; }
    .date { color: #787774; white-space: nowrap; font-size: 12px; }
    .route { white-space: nowrap; }

    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: #ADADAD;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h1>Feedback EasyEvTrip</h1>

<div id="login-section">
  <div class="login">
    <input type="password" id="key-input" placeholder="Clau d'administrador" />
    <button onclick="load()">Veure</button>
  </div>
  <div class="error" id="error-msg" style="display:none">Clau incorrecta o error de connexió.</div>
</div>

<div id="data-section" style="display:none">
  <div class="stats" id="stats"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Valoració</th>
          <th>Ruta</th>
          <th>Cotxe</th>
          <th>Comentari</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty-state" class="empty-state" style="display:none">Encara no hi ha cap valoració.</div>
  </div>
</div>

<script>
  const BACKEND = 'https://easyevtrip.onrender.com';

  async function load() {
    const key = document.getElementById('key-input').value.trim();
    if (!key) return;

    try {
      const res = await fetch(`${BACKEND}/admin/feedback?key=${encodeURIComponent(key)}`);
      if (res.status === 403) {
        document.getElementById('error-msg').style.display = 'block';
        return;
      }
      const rows = await res.json();
      document.getElementById('error-msg').style.display = 'none';
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('data-section').style.display = 'block';
      renderStats(rows);
      renderTable(rows);
    } catch (e) {
      document.getElementById('error-msg').style.display = 'block';
    }
  }

  document.getElementById('key-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') load();
  });

  function stars(n) {
    return '★'.repeat(n) + '☆'.repeat(5 - n);
  }

  function renderStats(rows) {
    const total = rows.length;
    const avg = total ? (rows.reduce((s, r) => s + r.rating, 0) / total).toFixed(1) : '—';
    const dist = [1,2,3,4,5].map(v => rows.filter(r => r.rating === v).length);

    document.getElementById('stats').innerHTML = `
      <div class="stat">
        <div class="stat-value">${total}</div>
        <div class="stat-label">Valoracions</div>
      </div>
      <div class="stat">
        <div class="stat-value">${avg} <span style="font-size:18px;color:#D4A017">★</span></div>
        <div class="stat-label">Mitjana</div>
      </div>
      ${[5,4,3,2,1].map(v => `
        <div class="stat">
          <div class="stat-value">${dist[v-1]}</div>
          <div class="stat-label">${stars(v)}</div>
        </div>
      `).join('')}
    `;
  }

  function renderTable(rows) {
    const tbody = document.getElementById('tbody');
    if (rows.length === 0) {
      document.getElementById('empty-state').style.display = 'block';
      return;
    }
    tbody.innerHTML = rows.map(r => {
      const date = new Date(r.created_at).toLocaleString('ca', {
        day: '2-digit', month: '2-digit', year: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
      const route = (r.origin && r.destination)
        ? `${r.origin} → ${r.destination}`
        : '<span class="empty-comment">—</span>';
      const car = r.car_category || '<span class="empty-comment">—</span>';
      const comment = r.comment
        ? `<span class="comment">${r.comment}</span>`
        : '<span class="empty-comment">sense comentari</span>';
      return `
        <tr>
          <td class="date">${date}</td>
          <td><span class="stars">${stars(r.rating)}</span></td>
          <td class="route">${route}</td>
          <td>${car}</td>
          <td>${comment}</td>
        </tr>`;
    }).join('');
  }
</script>
</body>
</html>
